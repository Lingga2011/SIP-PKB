<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>SIP-PKB — UPTD PPD Malingping</title>

  <!-- Icon tab browser (favicon) -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png" />
  <link rel="shortcut icon" href="favicon.ico" />

  <!-- Icon untuk "Add to Home Screen" di HP (iOS & Android) -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Tampilan mobile: warna tema browser + status bar -->
  <meta name="theme-color" content="#155a8a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SIP-PKB" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbzL7O-osyG_WvzpRv2eBY71gZeCbYoNpFw9WNqqmW39i139g20436CW_pkkhNEx4HPlWg/exec"
    title="Aplikasi SIP-PKB"
    allow="clipboard-write"
  ></iframe>

  <script>
    // Daftarkan service worker — syarat wajib agar Chrome membuatkan
    // WebAPK resmi (ditandatangani Google) saat "Install app"/"Add to
    // Home screen", bukan sekadar shortcut/bookmark biasa. Dibungkus
    // pengecekan fitur supaya tidak mengganggu browser lama yang belum
    // mendukung service worker.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('Pendaftaran service worker gagal:', err);
        });
      });
    }
  </script>
</body>
</html>
