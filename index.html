  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f3d63 0%, #155a8a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #0f3d63;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin: 0 auto 16px;
      display: block;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #dfe9f2;
      border-top-color: #155a8a;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @media (max-width: 380px) {
      .card { padding: 32px 24px; }
      h1 { font-size: 16px; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    p {
      font-size: 14px;
      color: #4b5f70;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      background: #155a8a;
      color: #fff;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    a.btn:hover { background: #0f3d63; }
    .url {
      margin-top: 16px;
      font-size: 11px;
      color: #93a3b0;
      word-break: break-all;
    }
  </style>
  <script>
    window.location.replace(
      "https://script.google.com/macros/s/AKfycbwvoSzxx2mD_yi2gbdqDUeC1-W9GCTpMlayCJSNUQMPcd3xvuhV1tiPPiNrIp_uQhkO_g/exec"

  <div class="card">
    <img class="logo" src="icon-192.png" alt="Logo Provinsi Banten" />

    <p>Anda sedang diarahkan ke aplikasi SIP PKB (UPTD PPD Malingping). Kalau tidak otomatis terbuka dalam beberapa detik, klik tombol di bawah.</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbwvoSzxx2mD_yi2gbdqDUeC1-W9GCTpMlayCJSNUQMPcd3xvuhV1tiPPiNrIp_uQhkO_g/exec">
      Buka Aplikasi
    </a>
    <div class="url">script.google.com/macros/s/AKfycbwvoSzxx2mD_yi2gbdqDUeC1-W9GCTpMlayCJSNUQMPcd3xvuhV1tiPPiNrIp_uQhkO_g/exec</div>
  </div>

</html>
